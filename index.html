<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nebbykit</title>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-color: #fff1e6;
      --text-color: #542b3c;
      --surface-color: #ffe0c2;
      --accent-color: #c64f5d;
      --shadow-color: rgba(84, 43, 60, 0.18);
      --sidebar-width: 180px;
    }

    body.dark-mode {
      --bg-color: #14213d;
      --text-color: #ffffff;
      --surface-color: #14213d;
      --accent-color: #ffffff;
      --shadow-color: rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    *:focus {
      outline: none;
    }

    body {
      min-height: 100vh;
      position: relative;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: "Ubuntu", Arial, sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }

    button,
    a,
    figure,
    input {
      cursor: pointer;
    }

    #globeBackground {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      opacity: 0.2;
      pointer-events: none;
    }

    #mainContent {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }

    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      display: flex;
      width: var(--sidebar-width);
      height: 100%;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      padding: 20px 15px;
      background: var(--surface-color);
      color: var(--text-color);
      box-shadow: 2px 0 8px var(--shadow-color);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }

    body.sidebar-open #sidebar {
      transform: translateX(0);
    }

    #sidebar::-webkit-scrollbar {
      width: 6px;
    }

    #sidebar::-webkit-scrollbar-thumb {
      background: var(--text-color);
      border-radius: 3px;
    }

    #sidebar input[type="search"] {
      width: 100%;
      margin: 15px 0 20px;
      padding: 10px 15px;
      border: 1px solid var(--text-color);
      border-radius: 20px;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: "Ubuntu", Arial, sans-serif;
      font-size: 14px;
      cursor: text;
    }

    #sidebar input[type="search"]::placeholder {
      color: var(--text-color);
      opacity: 0.7;
    }

    #sidebar input[type="search"]:focus {
      box-shadow: 0 0 0 2px var(--text-color);
    }

    #side-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1500;
      display: flex;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border: 1px solid var(--text-color);
      border-radius: 8px;
      background: var(--accent-color);
      color: var(--bg-color);
      font-size: 1.25rem;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s, transform 0.2s;
    }

    #side-toggle:hover {
      transform: scale(1.05);
      background: var(--text-color);
      color: var(--bg-color);
    }

    #sidebar-toggle {
      position: fixed;
      top: 20px;
      left: 12px;
      z-index: 1400;
      padding: 10px 12px;
      border: 1px solid var(--text-color);
      border-radius: 8px;
      background: var(--accent-color);
      color: var(--bg-color);
      font: inherit;
      cursor: pointer;
      transition: left 0.3s ease, background-color 0.3s, color 0.3s;
    }

    body.sidebar-open #sidebar-toggle {
      left: calc(var(--sidebar-width) + 12px);
    }

    #sidebar-bottom-logo {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
    }

    #sidebar-bottom-logo img {
      max-width: 50px;
      height: auto;
      border-radius: 8px;
    }

    #sidebar-bottom-logo p {
      margin-top: 8px;
      color: var(--text-color);
      font-size: 0.75em;
      line-height: 1.2;
    }

    #sidebar-bottom-logo a {
      color: var(--text-color);
      text-decoration: underline;
    }

    #categoriesContainer {
      width: 100%;
    }

    .category-btn,
    .page-button {
      width: 100%;
      margin-bottom: 8px;
      padding: 10px;
      border: 1px solid var(--text-color);
      border-radius: 12px;
      background: var(--accent-color);
      color: var(--bg-color);
      font-family: "Ubuntu", Arial, sans-serif;
      font-size: 0.9em;
      font-weight: bold;
      transition: transform 0.3s, background-color 0.3s, color 0.3s;
      text-align: center;
    }

    .category-btn:hover,
    .page-button:hover {
      transform: translateY(-2px);
      background: var(--text-color);
      color: var(--bg-color);
    }

    .page-button[aria-current="page"] {
      background: var(--text-color);
      color: var(--bg-color);
    }

    #favoritesList {
      width: 100%;
      margin-top: 8px;
    }

    #favoritesList > p {
      width: 100%;
      text-align: center;
      font-size: 0.75em;
    }

    .favorite-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 6px;
      width: 100%;
      margin-bottom: 8px;
    }

    .favorite-name {
      min-width: 0;
      color: var(--text-color);
      line-height: 1.3;
      overflow-wrap: anywhere;
      cursor: pointer;
    }

    .favorite-remove {
      flex: none;
      padding: 0 2px;
      border: 0;
      background: transparent;
      color: var(--text-color);
      font: inherit;
      font-size: 1.1em;
      line-height: 1.2;
      cursor: pointer;
    }

    #content {
      min-height: 100vh;
      margin-left: 0;
      padding: 80px 20px 30px;
      transition: margin-left 0.3s ease;
    }

    body.sidebar-open #content {
      margin-left: var(--sidebar-width);
    }

    .page-section {
      width: 100%;
    }

    .page-section[hidden] {
      display: none !important;
    }

    .page-title {
      margin-bottom: 16px;
    }

    .bluesky-carousel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
      width: 100%;
      padding: 4px 2px 16px;
      margin-bottom: 24px;
    }

    .bluesky-carousel > .bluesky-embed {
      display: block;
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      margin: 0 !important;
    }

    .bluesky-carousel .bluesky-embed iframe {
      display: block;
      width: 100% !important;
      max-width: 100% !important;
    }

    #ecosystem-title {
      margin-bottom: 12px;
    }

    #figures {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      align-items: start;
      padding: 4px 2px 12px;
    }

    figure {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      align-self: start;
      padding: 15px;
      border: 1px solid var(--text-color);
      border-radius: 12px;
      background: var(--surface-color);
      color: var(--text-color);
      box-shadow: 0 4px 8px var(--shadow-color);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    figure:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px var(--shadow-color);
    }

    figure a {
      display: flex;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }

    figure img {
      display: block;
      width: 120px;
      height: 120px;
      max-width: 100%;
      margin-bottom: 10px;
      border-radius: 8px;
      object-fit: contain;
      transition: transform 0.3s;
    }

    figure img:hover {
      transform: scale(1.05);
    }

    figcaption {
      width: 100%;
      margin-top: 8px;
      color: var(--text-color);
      font-size: 1.1em;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .figure-favorite {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 2px;
      border: none;
      background: transparent;
      color: var(--text-color);
      font-size: 1.2em;
      cursor: pointer;
    }

    #backToTop {
      position: fixed;
      right: 30px;
      bottom: 30px;
      z-index: 1200;
      display: flex;
      width: 60px;
      height: 60px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--text-color);
      border-radius: 50%;
      background: var(--accent-color);
      color: var(--bg-color);
      box-shadow: 0 4px 8px var(--shadow-color);
      font-size: 2em;
      font-weight: bold;
      transition: opacity 0.3s, transform 0.3s, background-color 0.3s, color 0.3s;
      cursor: pointer;
    }

    #backToTop.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #backToTop:hover {
      transform: scale(1.1);
      background: var(--text-color);
      color: var(--bg-color);
    }

    @media (max-width: 768px) {
      :root {
        --sidebar-width: 140px;
      }

      #sidebar {
        padding: 15px 10px;
      }

      figure {
        padding: 12px;
      }

      figure img {
        width: 110px;
        height: 110px;
      }

      figcaption {
        font-size: 1em;
      }
    }

    @media (max-width: 600px) {
      #content {
        padding: 80px 12px 30px;
      }

      body.sidebar-open #content {
        margin-left: 0;
      }

      .bluesky-carousel {
        grid-template-columns: minmax(0, 1fr);
        overflow: visible;
      }

      .bluesky-carousel > .bluesky-embed,
      .bluesky-carousel .bluesky-embed iframe {
        width: 100% !important;
        max-width: 100% !important;
      }

      #figures {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
        padding-right: 0;
        padding-left: 0;
      }

      figure {
        padding: 10px 8px;
      }

      figure img {
        width: 96px;
        height: 96px;
        margin-bottom: 6px;
      }

      figcaption {
        margin-top: 4px;
        font-size: clamp(0.85rem, 3.5vw, 1rem);
        line-height: 1.25;
      }

      .figure-favorite {
        top: 5px;
        right: 5px;
        font-size: 1.1em;
      }

      #backToTop {
        right: 16px;
        bottom: 16px;
        width: 50px;
        height: 50px;
      }

      #side-toggle {
        top: 16px;
        right: 16px;
      }
    }

    @media (max-width: 360px) {
      #figures {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 8px;
      }

      figure {
        padding: 9px 6px;
      }

      figure img {
        width: 78px;
        height: 78px;
      }

      figcaption {
        font-size: 0.82rem;
      }
    }
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

  <script>
    let camera;
    let renderer;
    let sphereMesh;

    function getThemeColor() {
      return document.body.classList.contains("dark-mode") ? 0xffffff : 0xc64f5d;
    }

    function updateGlobeColor() {
      if (sphereMesh) {
        sphereMesh.material.color.setHex(getThemeColor());
      }
    }

    function initGlobe() {
      const canvas = document.getElementById("globeBackground");

      if (!canvas || typeof THREE === "undefined") {
        return;
      }

      const width = window.innerWidth;
      const height = window.innerHeight;
      const scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.z = 2;

      try {
        renderer = new THREE.WebGLRenderer({
          canvas,
          alpha: true,
          antialias: true
        });
      } catch (error) {
        console.warn("WebGL is unavailable; continuing without the globe.", error);
        return;
      }

      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      const geometry = new THREE.SphereGeometry(0.9, 32, 32);
      const material = new THREE.MeshBasicMaterial({
        color: getThemeColor(),
        wireframe: true
      });

      sphereMesh = new THREE.Mesh(geometry, material);
      scene.add(sphereMesh);

      window.addEventListener("resize", () => {
        const w = window.innerWidth;
        const h = window.innerHeight;

        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      });

      function animate() {
        requestAnimationFrame(animate);
        sphereMesh.rotation.y += 0.001;
        renderer.render(scene, camera);
      }

      animate();
    }

    const figures = [
      {
        href: "https://gaze.cash/channel.html?chan=AAADKQ",
        src: "https://i.postimg.cc/rFVmNNBy/ezmaker-c907c3892d41a8a0762fb2540b20a741.png",

      },

        caption: "Electron Cash",
        categoryLabel: "NA"
      }
    ];

    let favorites = [];
    const backBtn = document.getElementById("backToTop");
    let hideTimeout = null;

    function showPage(pageName) {
      document.querySelectorAll(".page-section").forEach(section => {
        section.hidden = section.id !== `${pageName}-page`;
      });

      document.querySelectorAll(".page-button").forEach(button => {
        if (button.dataset.page === pageName) {
          button.setAttribute("aria-current", "page");
        } else {
          button.removeAttribute("aria-current");
        }
      });

      const isEcosystem = pageName === "ecosystem";
      document.getElementById("sidebar-search").hidden = !isEcosystem;
      document.getElementById("categoriesContainer").hidden = !isEcosystem;

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function loadFavorites() {
      try {
        const saved = localStorage.getItem("favorites");
        favorites = saved ? JSON.parse(saved) : [];

        if (!Array.isArray(favorites)) {
          favorites = [];
        }

        favorites = favorites.filter(index =>
          Number.isInteger(index) && figures[index]
        );
      } catch {
        favorites = [];
      }
    }

    function saveFavorites() {
      try {
        localStorage.setItem("favorites", JSON.stringify(favorites));
      } catch (error) {
        console.warn("Could not save favorites.", error);
      }
    }

    function updateFavoritesList() {
      const container = document.getElementById("favoritesList");
      container.innerHTML = "";

      if (favorites.length === 0) {
        const emptyMessage = document.createElement("p");
        emptyMessage.textContent = "No favorites yet.";
        container.appendChild(emptyMessage);
        return;
      }

      favorites.forEach(index => {
        const item = figures[index];
        if (!item) return;

        const row = document.createElement("div");
        row.className = "favorite-item";

        const name = document.createElement("span");
        name.className = "favorite-name";
        name.textContent = item.caption;
        name.title = item.caption;
        name.addEventListener("click", () => {
          window.open(item.href, "_blank", "noopener,noreferrer");
        });

        const removeButton = document.createElement("button");
        removeButton.className = "favorite-remove";
        removeButton.type = "button";
        removeButton.textContent = "★";
        removeButton.setAttribute(
          "aria-label",
          `Remove ${item.caption} from favorites`
        );
        removeButton.addEventListener("click", () => toggleFavorite(index));

        row.append(name, removeButton);
        container.appendChild(row);
      });
    }

    function toggleFavorite(index) {
      const favoriteIndex = favorites.indexOf(index);

      if (favoriteIndex === -1) {
        if (favorites.length >= 7) {
          alert("You can only have up to 7 favorites.");
          return;
        }
        favorites.push(index);
      } else {
        favorites.splice(favoriteIndex, 1);
      }

      saveFavorites();
      updateFavoritesList();
      populateFigures();
    }

    function populateFigures() {
      const container = document.getElementById("figures");
      container.innerHTML = "";

      figures.forEach((item, index) => {
        const figure = document.createElement("figure");
        figure.dataset.category = item.categoryLabel;
        figure.dataset.index = index;

        const favoriteButton = document.createElement("button");
        favoriteButton.className = "figure-favorite";
        favoriteButton.type = "button";
        favoriteButton.dataset.index = index;
        favoriteButton.textContent = favorites.includes(index) ? "★" : "☆";
        favoriteButton.setAttribute(
          "aria-label",
          favorites.includes(index) ? "Remove from favorites" : "Add to favorites"
        );

        const link = document.createElement("a");
        link.href = item.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const image = document.createElement("img");
        image.src = item.src;
        image.alt = item.caption;
        link.appendChild(image);

        const caption = document.createElement("figcaption");
        caption.textContent = item.caption;

        figure.append(favoriteButton, link, caption);
        container.appendChild(figure);
      });
    }

    function filterFigures(type, value) {
      const searchValue = value.toLowerCase();

      document.querySelectorAll("#figures figure").forEach(figure => {
        const category = figure.dataset.category.toLowerCase();
        const caption = figure.querySelector("figcaption").textContent.toLowerCase();

        if (type === "category") {
          figure.style.display =
            searchValue === "all" || category === searchValue ? "" : "none";
        } else if (type === "search") {
          figure.style.display =
            !searchValue ||
            category.includes(searchValue) ||
            caption.includes(searchValue)
              ? ""
              : "none";
        }
      });
    }

    function updateThemeToggle() {
      const toggle = document.getElementById("side-toggle");
      const isDark = document.body.classList.contains("dark-mode");

      toggle.textContent = isDark ? "☀️" : "🌙";
      toggle.setAttribute(
        "aria-label",
        isDark ? "Switch to light mode" : "Switch to dark mode"
      );

      updateGlobeColor();
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("dark-mode");
      initGlobe();
      updateThemeToggle();

      document.getElementById("side-toggle").addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");
        updateThemeToggle();
      });

      const sidebarToggle = document.getElementById("sidebar-toggle");

      sidebarToggle.addEventListener("click", () => {
        const isOpen = document.body.classList.toggle("sidebar-open");
        sidebarToggle.setAttribute("aria-expanded", String(isOpen));
        sidebarToggle.setAttribute(
          "aria-label",
          isOpen ? "Close sidebar" : "Open sidebar"
        );
        sidebarToggle.textContent = isOpen ? "× Close" : "☰ Menu";
      });

      document.querySelectorAll(".page-button").forEach(button => {
        button.addEventListener("click", () => showPage(button.dataset.page));
      });

      loadFavorites();
      populateFigures();
      filterFigures("category", "All");
      updateFavoritesList();
      showPage("home");

      document.getElementById("sidebar-search").addEventListener("input", event => {
        filterFigures("search", event.target.value);
      });

      document.addEventListener("click", event => {
        const button = event.target.closest(".figure-favorite");
        if (!button) return;

        event.preventDefault();
        event.stopPropagation();
        toggleFavorite(Number(button.dataset.index));
      });

      document.querySelectorAll(".category-btn").forEach(button => {
        button.addEventListener("click", () => {
          filterFigures("category", button.dataset.filter);
        });
      });

      window.addEventListener("scroll", () => {
        backBtn.classList.remove("hidden");

        if (hideTimeout) {
          clearTimeout(hideTimeout);
        }

        hideTimeout = setTimeout(() => {
          backBtn.classList.add("hidden");
        }, 2000);
      });

      backBtn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  </script>
</body>
</html>
